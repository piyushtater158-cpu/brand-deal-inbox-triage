{% import "partials/ui.html" as ui %}
<div id="decision-result" class="decision-result" aria-live="polite">{% if decision %}
  <div class="decision">
    {{ ui.icon('check', lg=true, cls='decision__icon') }}
    <div>
      <p class="decision__title">{{ decision.label }} · logged</p>
      <p class="decision__detail">{{ decision.detail }}</p>
    </div>
  </div>
{% endif %}</div>
