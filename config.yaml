# -----------------------------------------------------------------------------------
# Urgency (days until response_deadline, or go_live_date if no deadline given)
# -----------------------------------------------------------------------------------
urgency_days_high: 2      # <= 2 days -> urgency score 1.0, Urgent flag
urgency_days_medium: 7     # <= 7 days -> urgency score 0.6
# beyond urgency_days_medium -> urgency score 0.2 (never 0: a dated deal is still live)

# Phrases that mean "we'll pay you after we see results" — risky_payment_terms also
# fires on these even when advance%/net-days aren't both stated.
risky_payment_phrases:
  - "pay after results"
  - "pay after delivery"
  - "pay on completion"
  - "payment after campaign ends"

# -----------------------------------------------------------------------------------
# Duplicate detection
# -----------------------------------------------------------------------------------
duplicate_window_days: 14

# -----------------------------------------------------------------------------------
# No-go categories apply agency-wide in addition to each creator's own no_go_categories
# -----------------------------------------------------------------------------------
global_no_go_categories:
  - betting
  - crypto
  - tobacco
  - fairness creams
  - forex

# -----------------------------------------------------------------------------------
# Spam / scam detection (AI-off hard patterns)
# -----------------------------------------------------------------------------------
spam_patterns:
  pay_to_join_phrases:
    - "registration fee"
    - "joining fee"
    - "pay to join"
    - "processing charge"
    - "security deposit"
  crypto_forex_terms:
    - crypto
    - bitcoin
    - forex
    - "trading signal"
    - "investment scheme"
  shortened_link_domains:
    - bit.ly
    - tinyurl.com
    - t.co
    - cutt.ly
    - rb.gy
  # edit distance <= this vs a known_brands domain -> lookalike domain
  lookalike_domain_max_edit_distance: 2
  known_brand_domains:
    santoor: santoor.in
    nivea: nivea.in
    mamaearth: mamaearth.in
  # free-mail providers carrying a big brand name in the display name/subject are
  # suspicious (suspicious_sender flag, not necessarily spam type on their own)
  free_mail_domains:
    - gmail.com
    - yahoo.com
    - outlook.com
    - rediffmail.com
    - hotmail.com

# -----------------------------------------------------------------------------------
# AI
# -----------------------------------------------------------------------------------
ai:
  model_env_var: OPENROUTER_MODEL
  vision_model_env_var: OPENROUTER_VISION_MODEL
  api_key_env_var: OPENROUTER_API_KEY
  max_retries: 1
