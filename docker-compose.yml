services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_VISION_MODEL=${OPENROUTER_VISION_MODEL:-}
      - AI_ENABLED_DEFAULT=${AI_ENABLED_DEFAULT:-false}
    volumes:
      - app_data:/app/data

volumes:
  app_data:
