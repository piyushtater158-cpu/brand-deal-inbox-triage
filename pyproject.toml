[project]
name = "brand-deal-inbox-triage"
version = "0.1.0"
description = "Brand Deal Inbox Triage — Kalakaaar talent-manager proof-of-work (SAMPLE DATA)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
